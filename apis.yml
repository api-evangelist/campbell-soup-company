aid: campbell-soup-company
name: The Campbell's Company
description: >-
  The Campbell's Company (formerly Campbell Soup Company) is an American
  manufacturer and marketer of branded convenience food products including
  soups, simple meals, beverages, and snacks. Major brands include Campbell's,
  Rao's, V8, Pace, Pepperidge Farm, Snyder's of Hanover, Lance, Cape Cod,
  Kettle Brand, Goldfish, and Prego. The company operates consumer-facing
  digital properties, an investor relations portal, a careers platform, and
  supplier resources, but does not publish general-purpose public APIs.
